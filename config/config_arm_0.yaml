/**/dynamixels:
  ros__parameters:
    port: /dev/ttyUSB0
    baudrate: 1000000
    feedback_rate: 50.0

    motor_names: [inner_motor, middle_motor, outer_motor,
               global_rotation_motor, global_insertion_motor]
    motor_ids: [1, 2, 3, 4]

    operating_modes:
      - extended_position
      - extended_position
      - extended_position
      - extended_position
      - extended_position


    current_scales: [1.0, 1.0, 1.0, 1.0]

    # Software position limits (rad)
    position_min: [-6.28, -6.28, -6.28, -6.28]
    position_max: [6.28, 6.28, 6.28, 6.28]
